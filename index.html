<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Integrated Management System
  </title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>


<!-- =========================
     SESSION LOADING
========================== -->
<div
  id="sessionLoading"
  class="session-loading"
>

  <div class="session-loading-card">

    <div class="session-loading-logo">
      IMS
    </div>

    <div class="session-loading-text">
      Loading...
    </div>

  </div>

</div>

  
<!-- =========================
     LOGIN SCREEN
========================== -->
<div id="loginScreen" class="login-screen">

  <div class="login-card">

    <div class="login-logo">
      IMS
    </div>

    <div class="login-title">
      Integrated Management System
    </div>

    <div class="login-subtitle">
      ISO 9001 / IATF 16949 / ISO 14001
    </div>

    <form id="loginForm">

      <div class="login-field">
        <label for="loginUsername">
          Username
        </label>

        <input
          type="text"
          id="loginUsername"
          autocomplete="username"
          required
        >
      </div>


      <div class="login-field">
        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required
        >
      </div>


      <div
        id="loginError"
        class="login-error"
        hidden
      ></div>


      <button
        type="submit"
        id="loginButton"
        class="login-button"
      >
        LOGIN
      </button>

    </form>

  </div>

</div>


<div class="app">


  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebar-header">

      <div>

        <div class="logo">
          IMS
        </div>

        <div class="logo-subtitle">
          Integrated Management
        </div>

      </div>

    </div>


    <nav
      id="sidebarMenu"
      class="sidebar-menu"
    ></nav>

  </aside>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

      <button
        id="sidebarToggle"
        class="sidebar-toggle"
      >
        ☰
      </button>

      <div class="user-profile">
      
        <div class="user-info">
      
          <div id="currentUsername">
            Guest User
          </div>
      
          <small id="currentRole">
            Not Logged In
          </small>
      
        </div>
      
        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          Logout
        </button>
      
      </div>

    </header>



    <!-- CONTENT -->

    <section
      id="pageContent"
      class="content"
    ></section>


  </main>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>


</body>

</html>
